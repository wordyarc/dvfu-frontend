<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пример 6 — fetch и async/await</title>
    <style>
      body {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 16px;
        font-family: system-ui, sans-serif;
      }

      button {
        padding: 10px 14px;
        cursor: pointer;
      }

      #status {
        min-height: 1.5em;
      }

      li {
        margin-block: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Задачи с сервера</h1>
    <button id="load" type="button">Загрузить задачи</button>
    <p id="status" aria-live="polite"></p>
    <ul id="tasks"></ul>

    <script>
      const loadButton = document.querySelector("#load");
      const status = document.querySelector("#status");
      const list = document.querySelector("#tasks");

      async function loadTasks() {
        status.textContent = "Загрузка...";
        loadButton.disabled = true;
        list.replaceChildren();

        try {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/todos?_limit=5",
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const tasks = await response.json();

          for (const task of tasks) {
            const item = document.createElement("li");
            item.textContent = task.completed
              ? `✓ ${task.title}`
              : task.title;
            list.append(item);
          }

          status.textContent = `Загружено задач: ${tasks.length}`;
        } catch (error) {
          status.textContent = "Не удалось загрузить задачи";
          console.error(error);
        } finally {
          loadButton.disabled = false;
        }
      }

      loadButton.addEventListener("click", loadTasks);
    </script>
  </body>
</html>
